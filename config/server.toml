# Server identity and network configuration

[identity]
name        = "Black Tek"
owner_name  = ""
owner_email = ""
url         = ""
location    = ""
motd        = "Welcome to The Black Tek Server!"

[world]
# Which row of config/worlds.toml this process is. The matching row's address,
# port and schema must agree with [network].ip, [network].game_port_modern and
# config/database.toml's [mysql].database, or the server refuses to boot.
id              = 0
# Valid values: "pvp", "no-pvp", "pvp-enforced"
type            = "pvp"
map_name        = "canary"
map_author      = "Unknown"
assets_dat_path = "data/items/assets.dat"
# protobuf appearances from a modern (13.40+) client; optional - used to
# validate the modern client id mapping and, later, wire-format parity
appearances_dat_path = "data/items/appearances.dat"

[startup]
# Windows only. Valid values: "normal", "above-normal", "high"
default_priority = "high"

[network]
ip                       = "127.0.0.1"
# ipv6 is only used when bind_only_global_address = true
ipv6                     = "::"
# enable_ipv6 uses a dual-stack socket (accepts IPv4 and IPv6) unless bind_only_global_address = true
enable_ipv6              = false
ipv6_fallback_to_ipv4    = true
bind_only_global_address = false
# Legacy (10.98) listeners retired 2026-08-11 — this server is 15.25-only.
# 0 disables; modern clients learn their port from the login webservice.
# 7171 is a client-side constant, not a preference: a 15.25 client only talks to
# an in-binary login server on 7171, and on any other port it goes to HTTP login
# instead. So this value cannot be moved out of a port collision — the other
# listener has to move, and the server refuses to boot on a collision. That is
# why status_port below is 7184 and must stay off 7171 (its built-in default).
login_port               = 7171
game_port                = 0
# 13.40+ clients connect here (they learn the port from the login webservice).
# The modern handshake is framed differently, so it gets its own listener.
# Set to 0 to disable.
game_port_modern         = 7183
status_port              = 7184
# 0 = no limit
max_players              = 0
max_packets_per_second   = 10000
status_timeout           = 5000
replace_kick_on_login    = true
allow_clones             = false
# allow_walkthrough applies to players only
allow_walkthrough        = true

[accounts]
one_player_per_account = true
free_premium           = false

[account_manager]
enabled             = true
allow_no_pass_login = true
password            = "1"
position_x          = 0
position_y          = 0
position_z          = 0
