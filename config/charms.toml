# Charm runes for the bestiary.
#
# A character earns charm points by completing bestiary entries, spends them
# here to unlock runes (three tiers each; the points list is the price of
# each tier), and then assigns a rune to a creature whose entry is complete.
# An assigned rune becomes an augment against that creature, built from the
# `modifiers` list below in the same vocabulary as data/augments/*.toml
# (mod, value, factor, damage, origin) with one `chance` per tier.
#
# `category`: major (charm points) or minor. `effect`: offensive, defensive
# or passive, shown by the client only. `percent` and `chance` are what the
# client displays; the modifiers decide what actually happens.
#
# Charms without modifiers are listed so the rune wall is complete; they
# unlock and assign like the others and take effect once their system lands.

[Wound]
id = 0
name = "Wound"
description = "Triggers on a creature with a certain chance and deals 5% of its initial hit points as physical damage once."
category = "major"
effect = "offensive"
damage = "physical"
percent = 5
chance = [5, 10, 11]
points = [240, 360, 1200]
modifiers = [
	{ mod = "critical", value = 5, chance = [5, 10, 11], damage = "physical" },
]

