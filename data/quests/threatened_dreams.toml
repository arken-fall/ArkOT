missions = [
    {name = "Troubled Animals", storage = 45752, start = 1, end = 16, ignoreend = false, states = [ {id = 1, description = "You met the talking white deer Alkestios. It turned out he is actually a fae - and needs help. Search out a poacher camp north of the Green Claw Swamps and keep the poachers from hunting white deers."}, {id = 2, description = "You found a book with legends in the poacher camp. You asked Ahmed to add a story about how it brings ill luck to kill a white deer, hopefully the poachers will desist from hunting Alkestios."}, {id = 3, description = "You returned to the poacher camp and placed the faked book noticeably on a table. You're quite sure the poachers will discover it soon and desist from hunting Alkestios."}, {id = 4, description = "Alkestios asked you for help on another issue. There seemms to be a problem with a wolf mother and her whelps. Find the snake Ikassis in the north-west of Edron and talk to her, she knows more."}, {id = 5, description = "The snake Ikassis asked you to find a female wolf in the south of Cormaya. The animal is in need of help, yet Ikassis didn't know any details."}, {id = 6, description = "You found the ghostly wolf and promised to search for her lost whelps. The wolf told you to start your search at Ulderek's Rock"}, {id = 7, description = "At Ulderek's Rock you found a sleeping war wolf. It might actually be the now grown up whelp you were looking for. The skeleton nearby implies that the hunter didn't survive his misdeed."}, {id = 8, description = "You talked to Irmana in Venore and she gave you the fur of one of the wolf whelps you're searching for. You should talk to their mother's ghost."}, {id = 9, description = "As the ghostly wolf asked you, you placed the whelp fur in the mouth of a nearby stone, that is shaped like a big face."}, {id = 10, description = "You redeemed the ghostly wolf. You should return to Ikassis and tell her about it."}, {id = 11, description = "Ikassis was happy to hear that you redeemed the ghostly wolf. But she asked you to help someone else: one of her sisters. You can find her in the guise of swan at a river sourth-east of Ikassis."}, {id = 12, description = "You met a swan that in truth is a swan maiden, a kind of fae. These fae have magical cloaks that allow them to shape change between swan and girl. Find this maiden's cloak that was stolen by a troll."}, {id = 13, description = "The troll Grarkharok sold the cloak to Tereban and he lost it during a flight with magic carpet. The cloak's feathers are now scattered along the carpet's beeline between Edron and Darashia."}, {id = 14, description = "You found many swan feathers on Edron and in Darama desert. Now you should have enough for an entire cloak. You should talk to the swan maiden."}, {id = 15, description = "You found enough magical swan feathers. The swan maiden will now be able to restore her cloak. You should talk to Alkestios again."}, {id = 16, description = "Alkestios was very happy about your support. You earned the Fae's trust and may now enter their secret realm. Search for an elemental shrine of ice, fire, earth or energy to reach Feyrist."} ]}, # Quest.U11_40.ThreatenedDreams.Mission01.1
    {name = "Nightmare Intruders", storage = 45761, start = 1, end = 8, ignoreend = false, states = [ {id = 2, description = "You killed 200 of the nightmare monsters that are invading Feyrist. Maelyrra was very happy but it seems she still has other problems. She may need your help once more."}, {id = 3, description = "Maelyrra asked you to retrieve an artefact for her: the moon mirror. It was stolen by the tainted fae who inhabit the caves underneath Feyrist. She also asked you to free some captured fairies."}, {id = 4, description = "You found the moon mirror and freed the captured fairies. Maelyrra was very happy but it seems she has another problem. Perhaps you should offer your assistance once more."}, {id = 5, description = "The barrier that protects Feyrist from the outside world is weakened. To strengthen it again you need to find the starlight vial and the sun catcher. Ask Aurita and Taegen for these items."}, {id = 6, description = "Gather sunlight, starlight and moon rays. You have to do this with the sun catcher on the beach, with the starlight vial high in the mountains and with the moon mirror on a glade in the forest."}, {id = 7, description = "You may now repair the barrier. Charge the five moon sculptures of Feyrist with moon rays, the five dreambird trees with starlight and the five sun mosics with sunlight."}, {id = 8, description = "You repaired tha magical barrier that protects Feyrist from the outside world. The fae's secret realm is safe again."} ]}, # Quest.U11_40.ThreatenedDreams.Mission02.1
    {name = "An Unlikely Couple", storage = 45792, start = 1, end = 4, ignoreend = false, states = [ {id = 1, description = "Help Aurita and Taegen and find a spell to transform Aurita's fishtail into legs temporarily. A fairy in a small fae village in the southwest of Feyrist might know more."}, {id = 2, description = "You have succesfully created the magical music notes for the mermaid Aurita. Talk to the faun Taegen, he also needs your help."}, {id = 3, description = "The faun Taegen wants to spend some time with his lover, the mermaid Aurita. He wants to visit her home and thus must be able to breath under water. Therefore he needs the rare raven herb."}, {id = 4, description = "You found the rare raven herb and gave it to Taegen. Now he will create a sun catcher for you. You may also ask Aurita for the starlight vial now."} ]}, # Quest.U11_40.ThreatenedDreams.Mission03.1
]
