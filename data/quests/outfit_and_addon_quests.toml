    {name = "Warrior Addon: Shoulder Spike", storage = 12067, start = 1, end = 7, ignoreend = false, states = [ {id = 1, description = "Your current task is to bring 100 hardened bones to Trisha in Carlin. They can sometimes be extracted from creatures that consist only of - you guessed it, bones. You need an obsidian knife though."}, {id = 2, description = "Your current task is to bring 100 turtle shells to Trisha in Carlin. Turtles can be found on some idyllic islands which have recently been discovered."}, {id = 3, description = "Your current task is to show that you have fighting spirit. Maybe someone grants you a wish...?"}, {id = 4, description = "Your current task is to obtain a dragon claw. You cannot get this special claw from any common dragons in Tibia. It requires a special one, a lord among the lords."}, {id = 5, description = "You have delivered all items requried for the shoulder spike addon. Go talk to Cornelia and tell her Trisha sent you. She will be glad to create the should spikes."}, {id = 6, description = "Cornelia is currently creating the should spikes for you. Be patient and don't forget to check on it later!"}, {id = 7, description = "You have obtained the shoulder spike addon."} ]}, # OutfitQuest.WarriorShoulderAddon
    {name = "Wizard Outfits Quest", storage = 12066, start = 1, end = 7, ignoreend = false, states = [ {id = 1, description = "Bring Lugri the Medusa shield!"}, {id = 2, description = "Bring Lugri the Dragon Scale Mail!"}, {id = 3, description = "Bring Lugri the Crown Legs!"}, {id = 4, description = "Bring Lugri the Ring of the Sky!"}, {id = 5, description = "You got the first Outfit Addon!"}, {id = 6, description = "Bring The Queen Of The Banshees 50 Holy Orchids and she will reward you with the second addon."}, {id = 7, description = "You got the second Outfit Addon!"} ]}, # OutfitQuest.WizardAddon
    {name = "Pirate Outfit Quest (Sabre)", storage = 50002, start = 1, end = 5, ignoreend = false, states = [ {id = 1, description = "Bring Duncan 100 Eye Patches from pirates!"}, {id = 2, description = "Bring Duncan 100 peg legs from pirates!"}, {id = 3, description = "Bring Duncan 100 pirate hooks from pirates!"}, {id = 4, description = "Go to Morgan and tell him this codeword: 'firebird' to get the outfit addon!"}, {id = 5, description = "You got the Outfit Addon!"} ]}, # OutfitQuest.PirateSabreAddon
