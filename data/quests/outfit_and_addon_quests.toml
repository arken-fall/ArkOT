    {name = "Barbarian Outfit Quest", storage = 12015, start = 1, end = 17, ignoreend = false, states = [ {id = 1, description = "Bron told you that his brother Ajax in Northport needs to learn that violence is not always the answer. He told you to make his brother angry, then show him that all he needed to do was say 'please' to fix the situation."}, {id = 2, description = "You will need to leave Ajax alone for an hour, then return to him."}, {id = 3, description = "Ajax told you that he has thought about it, and that violence is not always good. Return to Bron now, and tell him that Ajax said fist not always good"}, {id = 4, description = "Bron mentioned that he has someone in his house that he doesn't like, and he wants you to get advice from Ajax about how to handle the situation. Go back to Ajax and ask him about Gelagos"}, {id = 5, description = "Ajax told you his brother needs Fighting Spirit, and that you should get some from a Djinn and give it to him."}, {id = 6, description = "You brought Bron the Fighting Spirit. He acted a little strange."}, {id = 7, description = "In order to make a shirt as a present for Ajax, Bron wants you to bring him 50 Pieces of Red Cloth and 50 Pieces of Green Cloth."}, {id = 8, description = "Bron wants you to bring him 10 Spider Silk Yarn."}, {id = 9, description = "Bron wants you to bring him the Warrior's Sweat."}, {id = 10, description = "You brought him all required items! accept it!"}, {id = 11, description = "You got the Barbarian Wig Addon! Bring now the present from Bron to Ajax!"}, {id = 12, description = "Bring Ajax in Northport 100 Iron Ore."}, {id = 13, description = "Bring Ajax 1 Huge Chunk of Crude Iron."}, {id = 14, description = "Bring Ajax 50 Perfect Behemoth Fang"}, {id = 15, description = "Bring Ajax 50 Lizard Leather"}, {id = 16, description = "Come later in 2 hours and ask Ajax for the axe."}, {id = 17, description = "You got the Axe Addon!"} ]}, # OutfitQuest.BarbarianAddon
    {name = "Beggar Outfit: The Newest Fashion", storage = 12018, start = 1, end = 6, ignoreend = false, states = [ {id = 1, description = "Your current task is to bring Hugo 20 pieces of brown cloth, like the worn and ragged ghoul clothing."}, {id = 2, description = "Your current task is to bring 50 pieces of minotaur leather to Hugo. If you don't know how to get leather, you should ask Kalvin."}, {id = 3, description = "Your current task is to bring 10 bat wings to Hugo."}, {id = 4, description = "Your current task is to bring 30 heaven blossoms to Hugo. Elves are said to cultivate these flowers."}, {id = 5, description = "You brought all items required for the &quot;poor man's look&quot; to Hugo. He told you to come back to him after a whole day has passed, then the outfit should be finished."}, {id = 6, description = "You got the outfit!"} ]}, # OutfitQuest.BeggarOutfit
    {name = "Druid Outfit Quest", storage = 12013, start = 1, end = 10, ignoreend = false, states = [ {id = 1, description = "Ceiron sends you to collect a sample of the blooming Griffinclaw."}, {id = 2, description = "Ask Ceiron for task."}, {id = 3, description = "take Ceirons waterskin and try to fill it with water from this special trickle. In the mountains between Ankrahmun and Tiquanda are two hydra lairs. It is important that you take the water directly from the trickle, not from the pond"}, {id = 4, description = "Ask Ceiron for task."}, {id = 5, description = "Bring Ceiron 100 ounces of demon dust."}, {id = 6, description = "Ask Ceiron for task."}, {id = 7, description = "The last mission is to find and retrieve Ceiron's Wolf Tooth Chain lost inside the Orc Fortress."}, {id = 8, description = "Ask Ceiron for Faolan."}, {id = 9, description = "Head over to Cormaya, find A Majestic Warwolf's Cave and ask her about an addon."}, {id = 10, description = "You got the Outfit!"} ]}, # OutfitQuest.DruidHatAddon
    {name = "Hunter Outfit Quest", storage = 12055, start = 1, end = 5, ignoreend = false, states = [ {id = 1, description = "Elane sends you to Liberty Bay to bring her the Crossbow from the Cult."}, {id = 2, description = "Bring Elane 100 pieces of lizard leather and 100 pieces of red dragon leather."}, {id = 3, description = "Bring Elane 5 enchanted chicken wings."}, {id = 4, description = "Bring Elane one piece of royal steel, draconian steel and hell steel each."}, {id = 5, description = "You got the Outfit!"} ]}, # OutfitQuest.HunterHatAddon
    {name = "Knight Addon: Helmet", storage = 12154, start = 1, end = 6, ignoreend = false, states = [ {id = 1, description = "Your current task is to bring 100 perfect behemoth fangs to Gregor in Thais."}, {id = 2, description = "Your current task is to retrieve the helmet of Ramsay the Reckless from Banuta. These pesky apes steal everything they can get their dirty hands on."}, {id = 3, description = "Your current task is to obtain a flask of warrior's sweat, which can be magicially extracted from headgear worn by a true warrior, but only in small amounts. Djinns are said to be good at this."}, {id = 4, description = "Your current task is to bring royal steel to Gregor in Thais. Royal steel can only be refined by very skilled smiths."}, {id = 5, description = "You have delivered all items required for the helmet addon. Go talk to Sam and tell him Gregor sent you. He will be glad to refine your helmet."}, {id = 6, description = "Sam is currently creating the helmet for you. Be patient and don't forget to check on it later!"} ]}, # OutfitQuest.Knight.MissionHelmet
    {name = "Mage &amp; Summoner Outfit Quest (Wand)", storage = 12061, start = 1, end = 7, ignoreend = false, states = [ {id = 1, description = "You found Angelina in a Prison. She told you a secret: Lynda in Thais can create a blessed wand. Greet her from Angelina, maybe she will aid you."}, {id = 2, description = "Lynda send you to bring her a sample of all five wands and five rods (Snakebite, Moonlight, Necrotic, Terra, Hailstorm, Vortex, Dragonbreath, Decay, Cosmic Energy and Inferno)"}, {id = 3, description = "Bring Lynda 10 ounces of magic sulphur"}, {id = 4, description = "Bring Lynda the Necromancer's soul stone"}, {id = 5, description = "Bring Lynda 20 ankhs now to complete the ritual."}, {id = 6, description = "You need to wait 3 hours for the ritual to be completed"}, {id = 7, description = "You got the Outfit!"} ]}, # OutfitQuest.MageSummoner.AddonWand
    {name = "Mage &amp; Summoner Outfit Quest (Fluid Belt)", storage = 12062, start = 1, end = 2, ignoreend = false, states = [ {id = 1, description = "Now you can get a lottery ticket at Sandra for 100 empty vials."}, {id = 2, description = "You got the Outfit! Now you can get for a lottery prize 50000 gold!"} ]}, # OutfitQuest.MageSummoner.AddonBelt
    {name = "Female Mage and Male Summoner Addon: Headgear", storage = 12063, start = 1, end = 11, ignoreend = false, states = [ {id = 1, description = "Your current task is to bring 70 bat wings to Myra in Port Hope."}, {id = 2, description = "Your current task is to bring 20 pieces of red cloth to Myra in Port Hope. These are said to make an excellent material for a cape."}, {id = 3, description = "Your current task is to bring 40 pieces of ape fur to Myra in Port Hope."}, {id = 4, description = "Your current task is to bring 35 holy orchids to Myra in Port Hope. Elves are said to cultivate these."}, {id = 5, description = "Your current task is to bring 10 spools of spider silk yarn to Myra in Port Hope. Only very large spiders produce silk which is strong enough to be yarned by mermaids."}, {id = 6, description = "Your current task is to bring 60 lizard scales to Myra in Port Hope. Lizard scales are great for all sort of magical potions."}, {id = 7, description = "Your current task is to bring 40 red dragon scales to Myra in Port Hope."}, {id = 8, description = "Your current task is to bring 15 ounces of magic sulphur to Myra in Port Hope. Djinns are said to be good at extracting magic sulphur."}, {id = 9, description = "Your current task is to bring 30 ounces of vampire dusts to Myra in Port Hope. You might need to ask a priest for a special blessed stake to turn vampires into dust."}, {id = 10, description = "You finally collected all of the items which Myra asked for. Go talk to Zoltan in Edron and tell him that Myra nominated you for an award."} ]}, # OutfitQuest.MageSummoner.MissionHatCloak
