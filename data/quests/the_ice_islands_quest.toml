missions = [
    {name = "Befriending the Musher", storage = 12201, start = 1, end = 3, ignoreend = false, states = [ {id = 1, description = "Find Sniffler the husky of Iskan. He should be somewhere north west of the town. He is probably marking his territory so you should be able to find his trace. Call him sniffler and feed him with meat."}, {id = 2, description = "Tell Iskan that you found and feed Sniffler"}, {id = 3, description = "You are now a friend of Iskan and can ask him for a passage to Nibelor. You should ask Hjaern in Nibelor if you can help him."} ]}, # TheIceIslands.Mission01
    {name = "Nibelor 1: Breaking the Ice", storage = 12202, start = 1, end = 5, ignoreend = false, states = [ {id = 1, description = "Chakoyas may use the ice for a passage to the west and attack Svargrond. Use the rocks at east of nibelor on at least three of these places and the chakoyas probably won't be able to pass the ice."}, {id = 2, description = "You have broke 1 of 3 icepassages"}, {id = 3, description = "You have broke 2 of 3 icepassages"}, {id = 4, description = "You have broke 3 of 3 icepassages! Tell Hjaern your mission!"}, {id = 5, description = "You should ask Silfind if you can help her in some matters."} ]}, # TheIceIslands.Mission02
    {name = "Nibelor 2: Ecological Terrorism", storage = 12203, start = 1, end = 3, ignoreend = false, states = [ {id = 1, description = "Siflind send you to travel to a distant land to get ants from an Ant-Hill to perform ecological terrorism on some pirates on Tyrsung. Just use the jug on an anthill."}, {id = 2, description = "Now head back to Svargrond and go to Buddel, the drunk sailor in southern Svargrond, and ask him to take you to Tyrsung. Now go all the way to the southern shores where you find a outpost. Go to the bottom deck and use the jug with the western mast"}, {id = 3, description = "Go tell Siflind that you released the ants and aks her for mission!"} ]}, # TheIceIslands.Mission03
    {name = "Nibelor 3: Artful Sabotage", storage = 12204, start = 1, end = 2, ignoreend = false, states = [ {id = 1, description = "Siflind gave you a Vial of Paint to use on some Baby Seals. Go back to Tyrsung and follow the shore from Buddel south. Use the Vial of Paint on three of these seals."}, {id = 2, description = "Go tell Siflind that you painted the seals and aks her for mission!"} ]}, # TheIceIslands.Mission04
    {name = "Nibelor 4: Berserk Brewery", storage = 12205, start = 1, end = 6, ignoreend = false, states = [ {id = 1, description = "The first things needed are 5 bat wings to brew a berserker elixir. Bring her them!"}, {id = 2, description = "The next items Siflind need are 4 bear paws. Bring her them!"}, {id = 3, description = "The next items Siflind need are 3 bonelord eyes. Bring her them!"}, {id = 4, description = "The next items Siflind need are 2 fish fins. Bring her them!"}, {id = 5, description = "The next item Siflind need is a green dragon scale. Bring her that!"}, {id = 6, description = "You helped Siflind to defend Svargrond. Now Nilsor need help, go ask him for mission."} ]}, # TheIceIslands.Mission05
    {name = "Nibelor 5: Cure the Dogs", storage = 12206, start = 1, end = 8, ignoreend = false, states = [ {id = 1, description = "To cure Nilsor dogs, bring him the 1st of 7 ingredients: a Part of the Sun Adorer Cactus. Only an ordinary kitchen knife will be precise enough to produce the ingredient weneed."}, {id = 2, description = "To cure Nilsor dogs, bring him the 2nd of 7 ingredients: Geyser Water in a Waterskin. Use it on a geyser that is NOT active. The water of active geysers is far too hot."}, {id = 3, description = "To cure Nilsor dogs, bring him the 3rd of 7 ingredients: Fine Sulphur. Use an ordinary kitchen spoon on an inactive lava hole."}, {id = 4, description = "To cure Nilsor dogs, bring him the 4th of 7 ingredients: the Frostbite Herb. You can find it on mountain peaks. You will need to cut it with a fine kitchen knife."}, {id = 5, description = "To cure Nilsor dogs, bring him the 5th of 7 ingredients: Purple Kiss Blossom. The purple kiss is a plant that grows in a place called jungle. You will have to use a kitchen knife to harvest its blossom."}, {id = 6, description = "To cure Nilsor dogs, bring him the 6th of 7 ingredients: the Hydra Tongue. The hydra tongue is a common pest plant in warmer regions. You might find one in a shop."}, {id = 7, description = "To cure Nilsor dogs, bring him the 7th of 7 ingredients: Spores of a Giant Glimmercap Mushroom. The giant glimmercap mushroom exists in caves and other preferably warm and humid places. Use an ordinary kitchen spoon on a mushroom to collectits spores."}, {id = 8, description = "You found all ingredients to cure Nilsor dogs, ask him for mission. You can now travel by Dog Sleds to Inukaya."} ]}, # TheIceIslands.Mission06
    {name = "The Secret of Helheim", storage = 12207, start = 1, end = 3, ignoreend = false, states = [ {id = 1, description = "Hjaern might have a mission for you. So maybe you go and talk to him."}, {id = 2, description = "Hjaern send you to find someone in Svargrond who can give you a passage to Helheim and seek the reason for the unrest there."}, {id = 3, description = "You discovered the necromantic altar and should report Hjaern about it."} ]}, # TheIceIslands.Mission07
    {name = "The Contact", storage = 12208, start = 1, end = 4, ignoreend = false, states = [ {id = 1, description = "Get out of Nibelor and go to the Svargrond Explorer's Society. Ask Lurik for the mission."}, {id = 2, description = "Get to the raider camp, then follow to the extreme south where you find lots of barbarians. Near the southern most coastline, try looking for the NPC Nor. Ask him about Memory Crystal."}, {id = 3, description = "Go back to Lurik and deliver him the memory crystal."}, {id = 4, description = "Give Lurik some time to evaluate the information (ca. 5min). Then talk to him again about your mission."} ]}, # TheIceIslands.Mission08
    {name = "Formorgar Mines 1: The Mission", storage = 12209, start = 1, end = 2, ignoreend = false, states = [ {id = 1, description = "Find the entrance of the Formorgar Mines. Find some hint or someone who is willing to talk about what is going on there."}, {id = 2, description = "You found a old and tattered written paper in a skeleton next to a Restless Soul, you can only make out a signature: Tylaf, apprentice of Hjaern. Ask Hjaern about Tylaf."} ]}, # TheIceIslands.Mission09
    {name = "Formorgar Mines 2: Ghostwhisperer", storage = 12210, start = 1, end = 2, ignoreend = false, states = [ {id = 1, description = "Go back to the mine and ask the restless soul about his story."}, {id = 2, description = "You already have listen to his story!"} ]}, # TheIceIslands.Mission10
    {name = "Formorgar Mines 3: The Secret", storage = 12211, start = 1, end = 2, ignoreend = false, states = [ {id = 1, description = "The Cultists plan is to create a new demon army for their master to conquer the world. Hjaern and the other shamans must learn about it! Hurry before its too late."}, {id = 2, description = "The Cultists plan is to create a new demon army for their master to conquer the world. Hjaern and the other shamans are already informed!"} ]}, # TheIceIslands.Mission11
    {name = "Formorgar Mines 4: Retaliation", storage = 12212, start = 1, end = 6, ignoreend = false, states = [ {id = 1, description = "Hjaern gave you a spirit charm of cold. Travel to the mines and find four special obelisks to mark them with the charm."}, {id = 2, description = "1 of 4 obelisks are marked."}, {id = 3, description = "2 of 4 obelisks are marked."}, {id = 4, description = "3 of 4 obelisks are marked."}, {id = 5, description = "Once all 4 obelisks are marked report back to Hjaern."}, {id = 6, description = "You got the Norseman outfit and you have access to the Yakchal room deep in the Formorgar Mines."} ]}, # TheIceIslands.Mission12
    {name = "Barbarian Test 1: Barbarian Booze", storage = 12191, start = 1, end = 3, ignoreend = false, states = [ {id = 1, description = "You participate in the drinking challenge. Now you can get the permission for a few sips of barbarian mead in exchange for some honey."}, {id = 2, description = "Now drink from the bucket until you drink 10 sips in a row without passing out"}, {id = 3, description = "You have mastered the first task of the barbarian test. If you haven't done so yet, talk to Sven about it."} ]}, # BarbarianTest.Mission01
    {name = "Barbarian Test 2: The Bear Hugging", storage = 12192, start = 1, end = 2, ignoreend = false, states = [ {id = 1, description = "Somewhere north of Svargrond you will find a lonely bear which you have to hug. You wonder what you were thinking when accepting this quest..."}, {id = 2, description = "You passed the bear hugging test (and should take a bath). If you haven't done so yet, talk to Sven about it."} ]}, # BarbarianTest.Mission02
    {name = "Barbarian Test 3: The Mammoth Pushing", storage = 12193, start = 1, end = 2, ignoreend = false, states = [ {id = 1, description = "Find a mammoth north-west of Svargrond and knock it over. You wonder whether your mission is becoming a barbarian or rather commiting suicide."}, {id = 2, description = "You have knocked over a mammoth - though you wonder what this crushing noise at your spine was. If you haven't done so yet, talk to Sven about the mammoth pushing."} ]}, # BarbarianTest.Mission03
    {name = "The Honorary Barbarian", storage = 12190, start = 8, end = 8, ignoreend = false, states = [ {id = 8, description = "You are now a honorary barbarian and can become a citizen of Svargrond. If you haven't done so yet, you should look for a barbarian in need of help in the north of the town."} ]}, # BarbarianTest.Questline
