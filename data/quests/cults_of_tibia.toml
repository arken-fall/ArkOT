    {name = "The Strengthtening of the Minotaurs", storage = 45653, start = 0, end = 50, ignoreend = false, description = "The Strengthtening of the Minotaurs: |STATE|"}, # Quest.U11_40.CultsOfTibia.Minotaurs.JamesfrancisTask
    {name = "The Strengthtening of the Minotaurs", storage = 45654, start = 1, end = 5, ignoreend = false, states = [ {id = 1, description = "Gerimor told you that the naturalist Jamesfrancis is an expert of minotaurs. Right now he is investigating a cave in minocity. But this time something seems to be completely different."}, {id = 2, description = "Jamesfrancis already entered the inner part of the cave weeks ago but had to flee when the minotaurs became too strong. He gave you the key to investigate this room as well."}, {id = 3, description = "You found an entrance to the minotaur boss. You killed it and now you have to return to Jamesfrancis."}, {id = 4, description = "Jamesfrancis sent you to talk with Gerimor about the minotaur cult."}, {id = 5, description = "You have reported the Druid of Crunor about the minotaur cult."} ]}, # Quest.U11_40.CultsOfTibia.Minotaurs.Mission
    {name = "Patron of Arts", storage = 45657, start = 1, end = 15, ignoreend = false, states = [ {id = 1, description = "The Druid of Cronor gave you the hint that the Thais exhibition has expanded. The new section is called MOTA (Museum of Tibian Arts). It's really worth a visit."}, {id = 2, description = "Gareth told you how to become a patron of the arts. To fulfil your duty you have to manage some tasks. First you have to investigate the crime scene of a theft in the museum."}, {id = 3, description = "You found a ransom note, wich requests you to pay some money for the stolen picture to a stonge in Kazordoon. His name is Iwar. Nevertheless I should talk to Gareth first."}, {id = 4, description = "You told Gareth about the ransom note. He asked you to pay the money to Iwar to get the picture back. In his opinion, there is no alternative."}, {id = 5, description = "You paid the money to stooge in Kazordoon. You were told that the picture is delivered to Gareth himself."}, {id = 6, description = "You have to go to Angelo and get a magnifier to investigate all small pictures in the entrance hall of the MOTA. One of them should be a fake."}, {id = 7, description = "Angelo allowed you to take a magnifier from a crate next to the cave entrance."}, {id = 8, description = "You've fetched the magnifier from Angelo's crate. You're ready for your job in the museum."}, {id = 9, description = "Indeed! One of the investigated small pictures is fake. Report to Gareth!"}, {id = 10, description = "After you told Gareth about the fake painting, he asked you to go to Angelo to get a new picture."}, {id = 11, description = "Angelo was not willing to give you a new picture. However, they havent found any artefact in the sandy cave yet. Report to Gareth about your failure."}, {id = 12, description = "Even though you weren't successful in getting a replacement for the fake picture, Gareth gave you access to the last floor of the museum. This area is for patrons only."}, {id = 13, description = "INTERNAL MESSAGE: THIS NEED QUESTLOG INFORMATION"}, {id = 14, description = "The Denomintator opened the door for you after you answered his questions to the wanted number. In the end he mentioned the Druid of Conor. Maybe you should pay him a visit."}, {id = 15, description = "In the end you told the Druid of Crunor about your experiences in the MoTA."} ]}, # Quest.U11_40.CultsOfTibia.MotA.Mission
    {name = "Barkless", storage = 45666, start = 1, end = 7, ignoreend = false, states = [ {id = 1, description = "The members of the Barkless follow a rigid path of hardship and sacrifice. Their cult is located somewhere beneath Ab'dendriel. Whatever happened to their leader, only a true Barkless can find out."}, {id = 2, description = "You survived the sulphur and tar trial. You accepted the stigma of misfortune and vanity. The hardest part, however, is yet to come. Give your life to the ice... to become true and purified."}, {id = 4, description = "You broke enough Barkless markings to now reverse the seal held up by the cult object in the ritual chamber. The power you gained feels unnatural and excessive but it seems ther is no other way."}, {id = 5, description = "Something far more powerful than the beliel of your Barkless brothers and sisters powered the seal to the leader. Whatever the case - find Leiden, or as he's known to his devotees: the \"Penitent\"."}, {id = 6, description = "The Leiden you confronted has strayed far from his own original vision of Barkless. What you encountered was more monster than elf and less virtuous than his devotees would have you believe."}, {id = 7, description = "You returned to Gerimor after putting an end to the mischief of Leyden the Penitent. May the Barkless walk the true path again one day."} ]}, # Quest.U11_40.CultsOfTibia.Barkless.Mission
    {name = "Misguided", storage = 45690, start = 1, end = 5, ignoreend = false, states = [ {id = 1, description = "ASD"}, {id = 2, description = "Below a ruin in the vicinity of the outlaw camp east of Thais a strange figure in ragged clothes hinted at something weird going on in a cave. He seemed too confused to decide whether to stop you."}, {id = 4, description = "You defeated the cult leader of Misguided by uncovering the true master to pull his strings and freeing this world from its malicious existance. Return to Gerimor to tell him about the victory."}, {id = 5, description = "You have spoken to Gerimor about your victory."} ]}, # Quest.U11_40.CultsOfTibia.Misguided.Mission
    {name = "The Orc Idol", storage = 45679, start = 1, end = 3, ignoreend = false, states = [ {id = 1, description = "ASD"}, {id = 2, description = "ASD"}, {id = 3, description = "You returned to Gerimor after facing the being the orcs worshipped. Whatever it was, it did not find the orcs by accident. A far more powerful force seems to have strategically place it here."} ]}, # Quest.U11_40.CultsOfTibia.Orcs.Mission
    {name = "The Secret of the Sandy Cave", storage = 45682, start = 1, end = 10, ignoreend = false, states = [ {id = 1, description = "ASD"}, {id = 2, description = "ASD"}, {id = 3, description = "In the cave you haven't found one of the missing scientists. However, you have faced a lots of strange mummies and a green oasis at the end."}, {id = 4, description = "After you informed Angelo about your experiences in the cave, he asked you to go back to analyse the water of the oasis. For that reason you got an analysis tool."}, {id = 5, description = "You have analysed the water with the help of the analysis tool from Angelo."}, {id = 6, description = "You informed Angelo about the analyzed water. He gave you a counteragent, wich you have to apply to the oasis."}, {id = 7, description = "You applied the counteragent to the oasis, just like Angelo had asked you to. But the effect was different from what you had expected. A sandstorm approached and caused create damage to the oasis."}, {id = 8, description = "You Killed the boss"}, {id = 9, description = "You reported your victory to Angelo"}, {id = 10, description = "You have told Gerimor about your stay in the sandy cave. He was not really surprised and felt vindicated that the rumors about a cult in the cave might be true."} ]}, # Quest.U11_40.CultsOfTibia.Life.Mission
    {name = "Zathroth Remmants", storage = 45685, start = 1, end = 3, ignoreend = false, states = [ {id = 2, description = "ASD"}, {id = 3, description = "You returned to Gerimor after encounter with the remnants of Zathroth. On one hand its is furtunate that Zathroth indeed wasn't behind all this, but on the other... what is going on there?"} ]}, # Quest.U11_40.CultsOfTibia.Humans.Mission
]
