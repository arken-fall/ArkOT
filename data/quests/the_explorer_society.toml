    {name = "Joining the Explorers", storage = 40631, start = 1, end = 5, ignoreend = false, states = [ {id = 1, description = "The mission should be simple to fulfil. You have to seek out Uzgod in Kazordoon and get the pickaxe for us. Or just find dwarven pickaxe on your own..."}, {id = 2, description = "Get into Dwacatra and get Uzgod's family brooch."}, {id = 3, description = "Bring family brooch back to Uzgod"}, {id = 4, description = "Bring the pickaxe back to the Explorer Society representative."}, {id = 5, description = "You have completed Joining the Explorers"} ]}, # Quest.U7_6.ExplorerSociety.JoiningTheExplorers
    {name = "The Ice Delivery", storage = 40632, start = 6, end = 8, ignoreend = false, states = [ {id = 6, description = "Take this ice pick and use it on a block of ice in the caves beneath Folda. Get some ice and bring it here as fast as you can. If the ice melt away, report on your ice delivery mission anyway."}, {id = 7, description = "You have 10 minutes before the icicle defrosts. Run back to the Explorer Society representative!"}, {id = 8, description = "You have completed The Ice Delivery."} ]}, # Quest.U7_6.ExplorerSociety.TheIceDelivery
    {name = "The Butterfly Hunt", storage = 40633, start = 9, end = 17, ignoreend = false, states = [ {id = 9, description = "This preparation kit will allow you to collect a PURPLE butterfly you have killed. Just use it on the fresh corpse of a PURPLE butterfly."}, {id = 10, description = "Return the prepared butterfly to Explorer Society representative."}, {id = 11, description = "Ask for another butterfly hunt."}, {id = 12, description = "This preparation kit will allow you to collect a BLUE butterfly you have killed. Just use it on the fresh corpse of a BLUE butterfly."}, {id = 13, description = "Return the prepared butterfly to Explorer Society representative."}, {id = 14, description = "Ask for another butterfly hunt."}, {id = 15, description = "This preparation kit will allow you to collect a RED butterfly you have killed. Just use it on the fresh corpse of a RED butterfly."}, {id = 16, description = "Return the prepared butterfly to Explorer Society representative."}, {id = 17, description = "You have completed The Butterfly Hunt."} ]}, # Quest.U7_6.ExplorerSociety.TheButterflyHunt
    {name = "The Plant Collection", storage = 40634, start = 18, end = 26, ignoreend = false, states = [ {id = 18, description = "Take botanist's container. Use it on a jungle bells plant to collect a sample."}, {id = 19, description = "Report about your plant collection to Explorer Society representative."}, {id = 20, description = "Ask for plant collection when you are ready to continue."}, {id = 21, description = "Use botanist's container on a witches cauldron to collect a sample."}, {id = 22, description = "Report about your plant collection to Explorer Society representative."}, {id = 23, description = "Ask for plant collection when you are ready to continue."}, {id = 24, description = "Use this botanist's container on a giant jungle rose to obtain a sample."}, {id = 25, description = "Report about your plant collection to Explorer Society representative."}, {id = 26, description = "You have completed The Plant Collection."} ]}, # Quest.U7_6.ExplorerSociety.ThePlantCollection
    {name = "The Lizard Urn", storage = 40635, start = 27, end = 29, ignoreend = false, states = [ {id = 27, description = "In the south-east of Tiquanda is a small settlement of the lizard people. Beneath the newly constructed temple there, the lizards hide the urn. Acquire an ancient urn which is some sort of relic to the lizard people of Tiquanda."}, {id = 28, description = "Bring the Funeral Urn back to the Explorer Society."}, {id = 29, description = "You have completed The Lizard Urn."} ]}, # Quest.U7_6.ExplorerSociety.TheLizardUrn
    {name = "The Bonelord Secret", storage = 40636, start = 30, end = 32, ignoreend = false, states = [ {id = 30, description = "Travel to the city of Darashia and then head north-east for the pyramid. If any documents are left, you probably find them in the catacombs beneath."}, {id = 31, description = "Bring the Wrinkled Parchment back to the Explorer Society representative."}, {id = 32, description = "You have completed The Bonelord Secret."} ]}, # Quest.U7_6.ExplorerSociety.TheBonelordSecret
    {name = "The Orc Powder", storage = 40637, start = 33, end = 35, ignoreend = false, states = [ {id = 33, description = "As far as we can tell, the orcs maintain some sort of training facility in some hill in the north-east of their city. There you should find lots of their war wolves and hopefully also some of the orcish powder."}, {id = 34, description = "Bring the Strange Powder to the Explorer Society representative to complete your mission."}, {id = 35, description = "You have completed The Orc Powder."} ]}, # Quest.U7_6.ExplorerSociety.TheOrcPowder
    {name = "The Elven Poetry", storage = 40656, start = 36, end = 38, ignoreend = false, states = [ {id = 36, description = "This mission is easy but nonetheless vital. Travel Hellgate beneath Ab'Dendriel and get the book."}, {id = 37, description = "Bring back an elven poetry book to the Explorer Society representative."}, {id = 38, description = "You have completed The Elven Poetry."} ]}, # Quest.U7_6.ExplorerSociety.TheElvenPoetry
    {name = "The Memory Stone", storage = 40639, start = 39, end = 41, ignoreend = false, states = [ {id = 39, description = "In the ruins of north-western Edron you should be able to find a memory stone. "}, {id = 40, description = "Bring back a memory stone to the Explorer Society representative."}, {id = 41, description = "You have completed The Memory Stone."} ]}, # Quest.U7_6.ExplorerSociety.TheMemoryStone
    {name = "The Rune Writings", storage = 40640, start = 42, end = 44, ignoreend = false, states = [ {id = 42, description = "Somewhere under the ape infested city of Banuta, one can find dungeons that were once inhabited by lizards. Look there for an atypical structure that would rather fit to Ankrahmun and its Ankrahmun Tombs. Copy the runes you will find on this structure."}, {id = 43, description = "Report back to the Explorer Society representative."}, {id = 44, description = "You have completed The Rune Writings."} ]}, # Quest.U7_6.ExplorerSociety.TheRuneWritings
    {name = "The Ectoplasm", storage = 40641, start = 45, end = 47, ignoreend = false, states = [ {id = 45, description = "Take ectoplasm container and use it on a ghost that was recently slain."}, {id = 46, description = "Return back to the Explorer Society representative with the collected ectoplasm."} ]}, # Quest.U7_6.ExplorerSociety.TheEctoplasm
    {name = "The Spectral Dress", storage = 40642, start = 48, end = 50, ignoreend = false, states = [ {id = 48, description = "The queen of the banshees lives in the so called Ghostlands, south west of Carlin. Try to get a spectral dress from her."}, {id = 49, description = "Report to the Explorer Society with the spectral dress."} ]}, # Quest.U7_6.ExplorerSociety.TheSpectralDress
    {name = "The Spectral Stone", storage = 40643, start = 51, end = 55, ignoreend = false, states = [ {id = 51, description = "Please travel to our second base and ask them to mail us their latest research reports. Then return here and ask about new missions."}, {id = 52, description = "Tell our fellow explorer that the papers are in the mail already."}, {id = 53, description = "Take the spectral essence and use it on the strange carving in this building as well as on the corresponding tile in our second base."}, {id = 54, description = "Good! Now use the spectral essence on the strange carving in our second base."} ]}, # Quest.U7_6.ExplorerSociety.TheSpectralStone
    {name = "The Astral Portals", storage = 40644, start = 56, end = 56, ignoreend = false, states = [ {id = 56, description = "Both carvings are now charged and harmonised. You are able to travel in zero time from one base to the other, but you need to have an orichalcum pearl in your possession to use it as power source."} ]}, # Quest.U7_6.ExplorerSociety.TheAstralPortals
    {name = "The Island of Dragons", storage = 40645, start = 57, end = 59, ignoreend = false, states = [ {id = 57, description = "Travel to Okolnir and try to find a proof for the existence of dragon lords there in the old times. I think old Buddel might be able to bring you there."}, {id = 58, description = "Report back to Lurik with the dragon scale."} ]}, # Quest.U7_6.ExplorerSociety.TheIslandofDragons
    {name = "The Ice Music", storage = 40646, start = 60, end = 62, ignoreend = false, states = [ {id = 60, description = "There is a cave on Hrodmir, north of the southernmost barbarian camp Krimhorn. In this cave, there are a waterfall and a lot of stalagmites. Take the resonance crystal and use it on the stalagmites in the cave to record the sound of the wind."}, {id = 61, description = "Report back to Lurik."}, {id = 62, description = "Now you may use the Astral Bridge from Liberty Bay to Svargrond."} ]}, # Quest.U7_6.ExplorerSociety.TheIceMusic
    {name = "The Undersea Kingdom", storage = 40638, start = 1, end = 3, ignoreend = false, states = [ {id = 1, description = "Captain Max will bring you to Calassa whenever you are ready. Please try to retrieve the missing logbook which must be in one of the sunken shipwrecks."}, {id = 2, description = "Report about your Calassa mission to Berenice in Liberty Bay."}, {id = 3, description = "Congratulations, you completed the remaining part of this mission!"} ]}, # Quest.U7_6.ExplorerSociety.CalassaQuest
