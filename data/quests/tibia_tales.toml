    {name = "Jack to the Future", storage = 43300, start = 1, end = 11, ignoreend = false, states = [ {id = 1, description = "Spectulus told you about a failed experiment he once did, involving an intern named Jack, and asked you to help him rescue Jack. Go to Jack's house and talk to him about Spectulus."}, {id = 2, description = "You have talked to Jack and found out that he is not remembering the time accident or Spectulus. Return to Spectulus in the Edron Academy to tell him about your findings."}, {id = 3, description = "Spectulus wants you to trigger Jack's memory. Jack used to like his red cushioned chair, an old globe, a telescope, a large amphora and a rocking horse. Place those in his room and ask him about it."}, {id = 4, description = "You have talked to Jack about the furniture you placed in his house. Report it back to Spectulus in the Edron Academy."}, {id = 5, description = "Spectulus sent you once again to his former intern Jack. Explain the incident to the people close to him. Talk to Jack's mother and sister and return to Spectulus to report their reaction."}, {id = 6, description = "You have talked with Jack's mother and sister. Report it back to Spectulus."}, {id = 7, description = "Spectulus suggested asking Jack abouthis hobbies. Make Jack leave his hobby be by whateber means it takes. Only by doing this he will be separated from what distracts him from his former self."}, {id = 8, description = "You found out and destroyed Jack's hobby. Jack is now finally ready and beginning to change. He event seems to start remembering Spectulus and the Academy."}, {id = 9, description = "Jack is finally remembering Spectulus and the Academy. Report back your mission."}, {id = 10, description = "Spectulus found out that you were convincing the wrong Jack. His real intern was transported way back to the past. He left a note years ago which, to your misery, reached Spectulus a little too late."} ]}, # Quest.U8_7.JackFutureQuest.QuestLine
