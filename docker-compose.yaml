services:
  server-db:
    image: mariadb:latest
    pull_policy: always
    restart: always
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4"
    ]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: blacktekserver
      MYSQL_USER: blacktekserver
      MYSQL_PASSWORD: blacktekpassword
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./db-data:/var/lib/mysql
    networks:
      - blacktek-net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "blacktekserver", "-pblacktekpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  
  whodb:
    image: clidey/whodb:latest
    restart: always
    ports:
      - "8080:8080"
    networks:
      - blacktek-net

  # Login webservice for modern (13.40+) clients: validates email/password
  # over HTTP, writes a session into account_sessions, and points the client
  # at game_port_modern. Legacy 10.98 clients keep using port 7171.
  login-server:
    image: opentibiabr/login-server:latest
    restart: always
    ports:
      - "8090:8090"
    environment:
      - LOGIN_HTTP_PORT=8090
      - LOGIN_GRPC_PORT=9090
      - MYSQL_HOST=server-db
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=blacktekserver
      - MYSQL_USER=blacktekserver
      - MYSQL_PASS=blacktekpassword
      - SERVER_NAME=BlackTek
      - SERVER_IP=127.0.0.1
      - SERVER_PORT=7173
      - SERVER_LOCATION=USA
    networks:
      - blacktek-net
    depends_on:
      server-db:
        condition: service_healthy

  server:
    build:
      context: .
    restart: always
    ports:
      - "7171:7171"
      - "7172:7172"
      - "7173:7173"
    volumes:
      - .:/srv
    networks:
      - blacktek-net
    depends_on:
      server-db:
        condition: service_healthy

volumes:
  server-db-data:

networks:
  blacktek-net:
    driver: bridge